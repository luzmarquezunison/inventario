# ============================================================
#  Sistema de Inventario Tecnológico - Servidores II (UNISON)
#  Arquitectura: navegador -> nginx (proxy inverso) -> app (Flask) -> db (MySQL)
# ============================================================

services:

  # --- Capa de datos: MySQL con volumen persistente ---
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red_interna
    # Sin "ports": MySQL NO se publica hacia el anfitrión
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Capa de aplicación: Flask servido con Gunicorn ---
  app:
    build: ./app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ORGANIZACION: ${ORGANIZACION:-Universidad de Sonora}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_interna

  # --- Capa de entrada: Nginx como proxy inverso ---
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - red_interna

networks:
  red_interna:

volumes:
  datos_mysql:
